<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Setter Hub — Quality Jobs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:       #f7f7f5;
    --surface:  #ffffff;
    --surface2: #f0f0ed;
    --border:   #e4e4e0;
    --border2:  #d0d0ca;
    --text:     #111110;
    --muted:    #6b6b65;
    --accent:   #b5870d;
    --green:    #16a34a;
    --red:      #dc2626;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:       #111110;
      --surface:  #1c1c1a;
      --surface2: #252523;
      --border:   #2e2e2b;
      --border2:  #3a3a36;
      --text:     #f0efe8;
      --muted:    #8a8a82;
      --accent:   #d4a31a;
      --green:    #22c55e;
      --red:      #f87171;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:       #111110;
    --surface:  #1c1c1a;
    --surface2: #252523;
    --border:   #2e2e2b;
    --border2:  #3a3a36;
    --text:     #f0efe8;
    --muted:    #8a8a82;
    --accent:   #d4a31a;
    --green:    #22c55e;
    --red:      #f87171;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-inline: 16px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .page-wrap { max-width: 1040px; margin: 0 auto; padding-block: 1.5rem 4rem; }

  /* Header */
  .pm-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:.5rem; }
  .pm-role-title { font-size:1.1rem; font-weight:800; letter-spacing:-0.02em; }
  .pm-role-sub { font-size:0.65rem; font-family:'DM Mono',monospace; color:var(--muted); margin-top:2px; }

  /* Tab bar */
  .tab-bar {
    display:flex; gap:0.4rem; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:5px; margin-bottom:1.5rem;
  }
  .tab-btn {
    flex:1; min-width:110px; padding:7px 14px;
    border:none; border-radius:8px;
    font-size:0.72rem; font-family:'DM Mono',monospace; font-weight:600;
    cursor:pointer; transition:all 0.15s;
    background:transparent; color:var(--muted);
  }
  .tab-btn.active { background:var(--accent); color:#fff; }

  /* Loading / spinner */
  .loading { display:flex; align-items:center; gap:.6rem; color:var(--muted); font-size:0.82rem; padding:2rem 0; }
  .spinner {
    width:18px; height:18px; border:2px solid var(--border2);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin .7s linear infinite; flex-shrink:0;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Tab panels */
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* Sheets/Docs iframe panels */
  .sheet-panel { display:flex; flex-direction:column; gap:.75rem; height:calc(100vh - 210px); }
  .sheet-panel iframe { flex:1; border:1px solid var(--border); border-radius:14px; width:100%; background:var(--surface); }
  .sheet-panel-head { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; flex-wrap:wrap; gap:.5rem; }

  /* Open-in-Sheets button */
  .open-btn {
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.4rem .85rem; background:var(--accent); color:#fff;
    border-radius:8px; font-size:0.72rem; font-weight:700;
    text-decoration:none; white-space:nowrap;
  }

  /* GHL big button */
  .ghl-btn {
    display:flex; align-items:center; justify-content:center; gap:.8rem;
    width:100%; padding:1rem 1.5rem;
    background:linear-gradient(135deg,#b5870d,#d4a017);
    color:#fff; border-radius:14px;
    font-size:0.95rem; font-weight:800; text-decoration:none;
    letter-spacing:.01em; margin-bottom:1.25rem;
    box-shadow:0 4px 20px rgba(181,135,13,0.3);
    transition:opacity .15s;
  }
  .ghl-btn:hover { opacity:.88; }

  /* Stat cards */
  .stat-grid { display:flex; gap:.7rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .stat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:1.1rem 1.2rem; flex:1; min-width:130px;
  }
  .stat-label { font-size:0.63rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:.3rem; }
  .stat-value { font-size:1.6rem; font-weight:800; font-family:'DM Mono',monospace; color:var(--accent); line-height:1; }
  .stat-value.big { font-size:2.2rem; }
  .stat-sub { font-size:0.67rem; color:var(--muted); margin-top:.3rem; }

  /* Tables */
  .data-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  .data-table th {
    padding:.55rem .75rem; text-align:left;
    font-size:0.63rem; color:var(--muted); letter-spacing:.06em;
    text-transform:uppercase; font-weight:600; background:var(--surface2);
  }
  .data-table th.c { text-align:center; }
  .data-table td { padding:.6rem .75rem; border-bottom:1px solid var(--border); }
  .data-table td.c { text-align:center; font-family:'DM Mono',monospace; }
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:1.25rem; }
  .table-head { padding:.75rem 1rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .table-title { font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .table-sub { font-size:0.67rem; color:var(--muted); }
  .table-scroll { overflow-x:auto; }
</style>
</head>
<body>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const PROXY_URL          = 'https://script.google.com/macros/s/AKfycbzc7EaBrdRv3bmdkTIf4ZMl1dWIpTmzL6_RKUAFFf4z9m74TafFxw4LYOmarBeON_KP/exec';

  { id: 'set-3',  title: 'Industry Knowledge',                    wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'Everything you need to know about the building industry before you pick up the phone. Who builders are, what they do, how they operate, and the terminology you\'ll hear on every call.' },
  { id: 'set-4',  title: 'The Script',                            wistiaId: 'prtozk09cy', wistiaAspect: '1.5434083601286173', description: 'A complete walkthrough of the setter script — how to hold yourself on the call, the exact information to collect, and the ammunition you need to set the closer up for a successful sales call.' },
  { id: 'set-5',  title: 'How to Make Calls Through GoHighLevel', wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'Step-by-step: what to do when a lead comes through, how to book appointments inside GHL, and a full walkthrough of the CRM so you know exactly where everything lives.' },
  { id: 'set-6',  title: 'Live Call Examples',                    wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'Real call recordings covering at least five different outcomes and prospect types — motivated, hesitant, burned before, not ready, and ready to book. Watch how appointments get set in each scenario.', tabs: [{ label: 'Example Call 1', wistiaId: 'gfjh9ycsj0', wistiaAspect: '0.5625' }] },
  { id: 'set-6b', title: 'Live Calling Session (1 Hour)',         wistiaId: 'yveuh8kpvu', wistiaAspect: '1.5434083601286173', description: '⚠️ This video is one hour long — you must watch the entire thing. Skipping through will not give you what you need. This is a full, unedited hour of real dialling so you can see exactly what a productive session looks, sounds, and feels like in practice — the pace, the mindset, how to handle dead air, quick-fire rejections, and the moments that lead to a booked appointment. There is no substitute for seeing a real hour of work.' },
  { id: 'set-7',  title: 'Objection Handling',                    wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'A full deep-dive on handling objections. Learn why prospects push back, how to address the "been burned by a marketing agency" objection, and how to position Quality Jobs as completely different from anything they\'ve seen before.' },
  { id: 'set-8',  title: 'Following Up with the Hot List',        wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'How to use the hot list to make sure no lead gets left unturned. Covers follow-up cadence, how to build real relationships with builders over time, and how to keep warm leads moving even when they\'re not ready to book yet.' },

  { id: 'set-11', title: 'Tracking Your Numbers',                 wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'How to track and own your daily performance — calls made, appointments booked, show rate, and close rate. Learn which numbers matter, how to read them, and how to use your stats to identify where to improve and consistently hit your targets.' },
  { id: 'set-12', title: 'Competitor Research',                   wistiaId: null,          wistiaAspect: '1.7777777777777777', description: 'A full breakdown of every major marketing agency competitor operating in Australia — their pricing points, what they offer, and exactly how Quality Jobs is different. Know this cold so you can confidently position us on any call.' },
];

// ── Helpers ──────────────────────────────────────────────────────────────────
function parseDateStr(raw) {
  if (!raw) return null;
  const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(raw); return isNaN(d) ? null : d;
}

const STORE_KEY = 'qj_cc_sop_watched';
function sopWatched() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { return {}; } }
function sopMark(id, val) {
  const w = sopWatched(); w[id] = val;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(w)); } catch(e) {}
}
window._sopSubTab = window._sopSubTab || {};

// ── PIN lock ─────────────────────────────────────────────────────────────────
const LOCKED_TABS  = new Set(['new-leads', 'followups']);
const CORRECT_PIN  = '6969';
let   _pinBuffer   = '';
let   _pinTarget   = null;

function isUnlocked(id) {
  try { return JSON.parse(sessionStorage.getItem('qj_setter_unlocked') || '[]').includes(id); } catch(e) { return false; }
}
function markUnlocked(id) {
  try {
    const list = JSON.parse(sessionStorage.getItem('qj_setter_unlocked') || '[]');
    if (!list.includes(id)) list.push(id);
    sessionStorage.setItem('qj_setter_unlocked', JSON.stringify(list));
  } catch(e) {}
}

function showPinPad(tabId) {
  _pinBuffer = '';
  _pinTarget = tabId;
  const label = tabId === 'new-leads' ? 'New Leads' : 'Hot List';
  const el = document.getElementById('panel-' + tabId);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;gap:1.5rem">
      <div style="font-size:1.5rem">🔒</div>
      <div style="font-size:0.9rem;font-weight:800;color:var(--text)">${label}</div>
      <div style="font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--muted)">Enter PIN to access</div>

      <!-- Dots -->
      <div style="display:flex;gap:.75rem" id="pin-dots">
        ${[0,1,2,3].map(i => `<div id="dot-${i}" style="width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:var(--surface2);transition:all .15s"></div>`).join('')}
      </div>

      <!-- Error -->
      <div id="pin-error" style="font-size:0.68rem;font-family:'DM Mono',monospace;color:var(--red);min-height:1rem"></div>

      <!-- Keypad -->
      <div style="display:grid;grid-template-columns:repeat(3,72px);gap:.5rem">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? `<div></div>` : `
        <button onclick="pinPress('${k}')"
          style="height:60px;border-radius:12px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:${k==='⌫'?'1.2':'1.3'}rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .1s"
          onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='var(--surface)'">
          ${k}
        </button>`).join('')}
      </div>
    </div>`;
}

function pinPress(key) {
  if (key === '⌫') {
    _pinBuffer = _pinBuffer.slice(0, -1);
  } else if (_pinBuffer.length < 4) {
    _pinBuffer += key;
  }

  // Update dots
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot-' + i);
    if (dot) {
      dot.style.background    = i < _pinBuffer.length ? 'var(--accent)' : 'var(--surface2)';
      dot.style.borderColor   = i < _pinBuffer.length ? 'var(--accent)' : 'var(--border2)';
    }
  }

  if (_pinBuffer.length === 4) {
    if (_pinBuffer === CORRECT_PIN) {
      markUnlocked(_pinTarget);
      renderPanel(_pinTarget);
    } else {
      _pinBuffer = '';
      const err = document.getElementById('pin-error');
      if (err) err.textContent = 'Incorrect PIN — try again';
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot-' + i);
        if (dot) { dot.style.background = 'var(--red)'; dot.style.borderColor = 'var(--red)'; }
      }
      setTimeout(() => {
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById('dot-' + i);
          if (dot) { dot.style.background = 'var(--surface2)'; dot.style.borderColor = 'var(--border2)'; }
        }
        if (err) err.textContent = '';
      }, 900);
    }
  }
}
window.pinPress = pinPress;

// ── Tab routing ──────────────────────────────────────────────────────────────
const TABS = [
  { id: 'pipeline',    label: '📊 Lead Pipeline'  },
  { id: 'performance', label: '📈 Performance'    },
  { id: 'new-leads',   label: '🔔 New Leads'      },
  { id: 'followups',   label: '🔥 Hot List'       },
  { id: 'scripts',     label: '💬 Scripts'         },
  { id: 'sops',        label: '🎬 Video Modules'   },
  { id: 'offer',       label: '🎯 Our Offer'       },
];

function activeTab() {
  return localStorage.getItem('qj_setter_subtab_standalone') || 'sops';
}
function switchTab(id) {
  localStorage.setItem('qj_setter_subtab_standalone', id);
  renderTabBar();
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + id);
  if (!panel) return;
  panel.classList.add('active');
  if (LOCKED_TABS.has(id) && !isUnlocked(id)) {
    showPinPad(id);
  } else {
    renderPanel(id);
  }
}
window.switchTab = switchTab;

function renderTabBar() {
  const cur = activeTab();
  document.getElementById('tab-bar').innerHTML = TABS.map(t =>
    `<button class="tab-btn${cur===t.id?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

// ── Panel renderers ───────────────────────────────────────────────────────────
function renderPanel(id) {
  const el = document.getElementById('panel-' + id);
  if (!el) return;
  if (id === 'pipeline')    el.innerHTML = tplPipeline();
  if (id === 'new-leads')   el.innerHTML = tplNewLeads();
  if (id === 'followups')   el.innerHTML = tplFollowUps();
  if (id === 'scripts')     el.innerHTML = tplScripts();
  if (id === 'sops')        el.innerHTML = tplSOPs();
  if (id === 'offer')       el.innerHTML = tplOffer();
  if (id === 'performance') loadPerformance();
}

// ── Pipeline ──────────────────────────────────────────────────────────────────
function tplPipeline() {
  return `
    <div style="max-width:700px;padding-top:.5rem">
      <div style="margin-bottom:1.5rem">
        <div style="font-size:1rem;font-weight:800;margin-bottom:.3rem">📊 Lead Pipeline</div>
        <div style="font-size:0.72rem;font-family:'DM Mono',monospace;color:var(--muted)">Your live B2B pipeline lives inside GoHighLevel. Click below to open it directly.</div>
      </div>
      <a href="https://app.gohighlevel.com/v2/location/mMtrTqbMqNOoKetdQowt/opportunities" target="_blank"
        style="display:flex;align-items:center;justify-content:center;gap:.75rem;width:100%;padding:1.4rem 2rem;background:var(--accent);color:#fff;border-radius:16px;font-size:1.05rem;font-weight:800;text-decoration:none;letter-spacing:.01em;margin-bottom:1.25rem;box-shadow:0 4px 18px rgba(181,135,13,0.25)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open GoHighLevel Pipeline

// ── Performance ───────────────────────────────────────────────────────────────
function loadPerformance() {
  const panel = document.getElementById('panel-performance');
  if (!panel) return;
  panel.innerHTML = '<div class="loading"><div class="spinner"></div>Loading performance data…</div>';

  Promise.all([
    fetch(`${PROXY_URL}?id=${CALLS_SHEET_ID}&sheet=Raw%20Data`).then(r => r.json()),
    fetch(`${PROXY_URL}?id=${GROWTH_APPT_SHEET}&sheet=${encodeURIComponent(GROWTH_APPT_TAB)}`).then(r => r.json())
  ]).then(([callsRows, apptRows]) => {
    // ── Parse QJ calls (col 5 = "Quality Jobs") ──
    const qjCalls = [];
    if (Array.isArray(callsRows)) {
      for (let i = 1; i < callsRows.length; i++) {
        const row = callsRows[i];
        const client = String(row[5]||'').trim().toLowerCase();
        if (client !== 'quality jobs') continue;
        const d = parseDateStr(String(row[1]||''));
        if (d) qjCalls.push(d);
      }
    }

    // ── Parse appointments ──
    const appts = [];
    if (Array.isArray(apptRows)) {
      let dataStart = 1;
      for (let i = 0; i < Math.min(apptRows.length, 8); i++) {
        const r = apptRows[i]||[];
        if (String(r[6]||'').toLowerCase().includes('business') ||
            String(r[10]||'').toLowerCase().includes('show')) { dataStart = i + 1; break; }
      }
      for (let i = dataStart; i < apptRows.length; i++) {
        const r = apptRows[i];
        if (!r || !String(r[6]||'').trim()) continue;
        const rawBooked = r[4], rawAppt = r[5];
        const showRaw = String(r[10]||'').trim().toUpperCase();
        let bookedDate = null, apptDate = null;
        if (rawBooked) { const d = new Date(rawBooked); if (!isNaN(d)) bookedDate = d; }
        if (rawAppt)   { const d = new Date(rawAppt);   if (!isNaN(d)) apptDate   = d; }
        if (!bookedDate) continue;
        appts.push({ bookedDate, apptDate, showed: showRaw === 'Y', outcomeRecorded: showRaw === 'Y' || showRaw === 'N' });
      }
    }
    renderPerfPanel(panel, qjCalls, appts);
  }).catch(e => {
    panel.innerHTML = `<div style="color:var(--red);font-size:0.82rem">Failed to load: ${e.message} — <a href="#" onclick="loadPerformance();return false" style="color:var(--accent)">retry</a></div>`;
  });
}
window.loadPerformance = loadPerformance;

function renderPerfPanel(panel, calls, appts) {
  const now      = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const dayMs    = 86400000;
  const eod      = new Date(now); eod.setHours(23,59,59,999);

  const daysAgo   = n => new Date(+eod - n * dayMs);
  const toDateStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const callsByDate = {};
  calls.forEach(d => { const k = toDateStr(d); callsByDate[k] = (callsByDate[k]||0)+1; });

  const callsIn  = n => calls.filter(d => d >= daysAgo(n) && d <= eod).length;
  const apptsIn  = n => appts.filter(a => a.bookedDate >= daysAgo(n) && a.bookedDate <= eod).length;
  const showRate = n => {
    const cohort   = appts.filter(a => a.bookedDate >= daysAgo(n) && a.bookedDate <= eod);
    const happened = cohort.filter(a => a.apptDate && a.apptDate <= eod && a.outcomeRecorded);
    if (!happened.length) return null;
    return { showed: happened.filter(a => a.showed).length, total: happened.length };
  };
  const fmtRatio = (b,c) => c===0 ? '—' : `${Math.round(b/c*100)}%`;

  const todayCalls = callsByDate[todayStr]||0;
  const c7=callsIn(7), c14=callsIn(14), c21=callsIn(21), c30=callsIn(30);
  const b7=apptsIn(7), b14=apptsIn(14), b21=apptsIn(21), b30=apptsIn(30);
  const sr7=showRate(7), sr14=showRate(14), sr21=showRate(21), sr30=showRate(30), sr60=showRate(60), sr90=showRate(90);
  const totalCalls = calls.length, totalAppts = appts.length;
  const sr30v = sr30 ? Math.round(sr30.showed/sr30.total*100) : null;

  // Weekly grid
  const getMondayOf = d => { const dt=new Date(d); dt.setHours(0,0,0,0); const day=dt.getDay(); dt.setDate(dt.getDate()-(day===0?6:day-1)); return dt; };
  const currentMonday = getMondayOf(now);
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const mon  = new Date(+currentMonday - w * 7 * dayMs);
    const days = [];
    for (let d = 0; d < 5; d++) {
      const dt = new Date(+mon + d * dayMs);
      const ds = toDateStr(dt);
      days.push({ dt, ds, count: callsByDate[ds]||0, isFuture: dt>now, isToday: ds===todayStr });
    }
    weeks.push({ days, weekLabel: `${days[0].dt.getDate()}/${days[0].dt.getMonth()+1}`, weekTotal: days.reduce((s,d)=>s+d.count,0) });
  }
  weeks.reverse();

  const cellStyle = d => {
    if (d.isFuture) return 'color:var(--muted);opacity:0.3';
    if (d.isToday)  return 'background:var(--accent);color:#fff;border-radius:8px;font-weight:700';
    if (d.count===0) return 'color:var(--muted)';
    return `color:${d.count>=50?'var(--green)':d.count>=30?'#f59e0b':'var(--text)'}`;
  };

  const weekRows = weeks.map(w => `
    <tr style="border-bottom:1px solid var(--border)">
      <td style="padding:.55rem .75rem;font-size:0.75rem;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap">${w.weekLabel}</td>
      ${w.days.map(d=>`<td style="padding:.55rem .65rem;text-align:center;font-family:'DM Mono',monospace;font-size:0.85rem;${cellStyle(d)}">${d.isFuture?'':d.isToday?`${d.count} <span style="font-size:0.55rem;vertical-align:middle;opacity:0.85">●</span>`:(d.count||'—')}</td>`).join('')}
      <td style="padding:.55rem .75rem;text-align:center;font-family:'DM Mono',monospace;font-size:0.82rem;font-weight:700;color:${w.weekTotal>=200?'var(--green)':w.weekTotal>=100?'#f59e0b':'var(--text)'}">
        ${w.weekTotal||'—'}
      </td>
    </tr>`).join('');

  const sc = (label, value, sub='', color='var(--accent)', big=false) => `
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value${big?' big':''}" style="color:${color}">${value}</div>
      ${sub?`<div class="stat-sub">${sub}</div>`:''}
    </div>`;

  panel.innerHTML = `
    <div style="max-width:980px">
      <div class="stat-grid">
        ${sc('Calls Today', todayCalls, now.toLocaleDateString('en-AU',{weekday:'long'}), todayCalls>=50?'var(--green)':todayCalls>=20?'#f59e0b':'var(--accent)', true)}
        ${sc('Total Calls (All Time)', totalCalls, 'QJ B2B calls logged')}
        ${sc('Booked (Last 30d)', b30, fmtRatio(b30,c30)+' call → booking')}
        ${sc('Show Rate (30d)', sr30v!==null?sr30v+'%':'—', sr30?`${sr30.showed}/${sr30.total} showed`:'No data yet', sr30v>=60?'var(--green)':sr30v>=40?'#f59e0b':'var(--red)')}
      </div>

      <div class="table-wrap">
        <div class="table-head">
          <span class="table-title">Daily Call Volume — Mon to Fri</span>
          <span class="table-sub">Last 6 weeks · Today highlighted</span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr>
              <th>Week of</th>
              ${['Mon','Tue','Wed','Thu','Fri'].map(d=>`<th class="c">${d}</th>`).join('')}
              <th class="c">Total</th>
            </tr></thead>
            <tbody>${weekRows}</tbody>
          </table>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-head"><span class="table-title">Performance by Window</span></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Metric</th><th class="c">Last 7d</th><th class="c">Last 14d</th><th class="c">Last 21d</th><th class="c">Last 30d</th></tr></thead>
            <tbody style="border-top:1px solid var(--border)">
              <tr><td style="font-weight:600">📞 Calls Made</td>${[c7,c14,c21,c30].map(v=>`<td class="c">${v}</td>`).join('')}</tr>
              <tr><td style="font-weight:600">📅 Appts Booked</td>${[b7,b14,b21,b30].map(v=>`<td class="c">${v}</td>`).join('')}</tr>
              <tr><td style="font-weight:600">🎯 Call → Booking</td>${[[b7,c7],[b14,c14],[b21,c21],[b30,c30]].map(([b,c])=>`<td class="c">${fmtRatio(b,c)}</td>`).join('')}</tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-head"><span class="table-title">Show Rate by Booking Window</span></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Window</th><th class="c">Booked</th><th class="c">Showed</th><th class="c">No-Show</th><th class="c">Show Rate</th></tr></thead>
            <tbody style="border-top:1px solid var(--border)">
              ${[['Last 7 days',7,sr7],['Last 14 days',14,sr14],['Last 21 days',21,sr21],['Last 30 days',30,sr30],['Last 60 days',60,sr60],['Last 90 days',90,sr90]].map(([lbl,n,sr]) => {
                const booked = apptsIn(n), happened = sr?sr.total:0, showed = sr?sr.showed:0, noshow = happened-showed;
                const pct = sr ? Math.round(sr.showed/sr.total*100) : null;
                const pc  = pct===null?'var(--muted)':pct>=60?'var(--green)':pct>=40?'#f59e0b':'var(--red)';
                return `<tr style="border-bottom:1px solid var(--border)">
                  <td style="font-weight:600">${lbl}</td>
                  <td class="c">${booked}</td>
                  <td class="c" style="color:var(--green)">${happened?showed:'—'}</td>
                  <td class="c" style="color:var(--red)">${happened?noshow:'—'}</td>
                  <td class="c" style="font-weight:700;color:${pc}">${pct!==null?pct+'%':'—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div style="padding:.6rem 1rem;font-size:0.67rem;color:var(--muted);border-top:1px solid var(--border);display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
          <span>Col E = date booked · Col F = appt date · Col K = Y/N showed</span>
          <a href="https://docs.google.com/spreadsheets/d/${GROWTH_APPT_SHEET}/edit" target="_blank" style="color:var(--accent);text-decoration:none">↗ Open Appointments Sheet</a>
          <button onclick="loadPerformance()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:0.67rem;padding:0">↺ Refresh</button>
        </div>
      </div>
    </div>`;
}
