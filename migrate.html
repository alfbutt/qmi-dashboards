<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QJ Data Migration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #141414; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 2.5rem; max-width: 480px; width: 100%; text-align: center; }
  .logo { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.25rem; }
  .logo span { color: #C9A84C; }
  .sub { font-size: 0.75rem; color: #666; margin-bottom: 2rem; }
  h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  p { font-size: 0.82rem; color: #999; line-height: 1.6; margin-bottom: 1.5rem; }
  .count { font-size: 2.5rem; font-weight: 800; color: #C9A84C; margin: 1rem 0 0.25rem; }
  .count-label { font-size: 0.72rem; color: #666; margin-bottom: 1.5rem; }
  button { background: #C9A84C; color: #000; border: none; padding: 0.9rem 2rem; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; width: 100%; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 1rem; font-size: 0.8rem; color: #999; min-height: 1.2em; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Quality<span>Jobs</span></div>
  <div class="sub">qualityjobs.com.au · Data Migration</div>
  <h2>Move all your data to the new domain</h2>
  <p>Copies every client, churned/paused status, invoice history, tasks and settings to <strong>dashboard.qualityjobs.com.au</strong>.</p>
  <div class="count" id="count">—</div>
  <div class="count-label" id="count-label">scanning…</div>
  <button id="btn" onclick="go()" disabled>Migrate Now →</button>
  <div class="status" id="status"></div>
</div>
<script>
const keys = Object.keys(localStorage).filter(k => k.startsWith('qj_'));
const countEl = document.getElementById('count');
const labelEl = document.getElementById('count-label');
const btn     = document.getElementById('btn');
const status  = document.getElementById('status');

countEl.textContent = keys.length;
if (keys.length === 0) {
  labelEl.textContent = 'No QJ data found here.';
  status.textContent = 'Make sure you\'re running this on the github.io URL where your data lives.';
} else {
  labelEl.textContent = `data key${keys.length !== 1 ? 's' : ''} ready to migrate`;
  btn.disabled = false;
}

function go() {
  btn.disabled = true;
  btn.textContent = 'Migrating…';
  status.textContent = 'Packaging your data…';

  try {
    const data = {};
    keys.forEach(k => { try { data[k] = localStorage.getItem(k); } catch(e){} });
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    status.textContent = 'Redirecting to new domain…';
    // Pass data directly in the URL hash — no popup needed
    window.location.href = 'https://dashboard.qualityjobs.com.au/command-centre.html#qj_import=' + encoded;
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Try Again';
  }
}
</script>
</body>
</html>
