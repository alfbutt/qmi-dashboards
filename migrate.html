<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QJ Data Migration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #141414; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 2.5rem; max-width: 480px; width: 100%; text-align: center; }
  .logo { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.25rem; }
  .logo span { color: #C9A84C; }
  .sub { font-size: 0.75rem; color: #666; margin-bottom: 2rem; }
  h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  p { font-size: 0.82rem; color: #999; line-height: 1.6; margin-bottom: 1.5rem; }
  .count { font-size: 2rem; font-weight: 800; color: #C9A84C; margin: 1rem 0; }
  .count-label { font-size: 0.72rem; color: #666; margin-bottom: 1.5rem; }
  button { background: #C9A84C; color: #000; border: none; padding: 0.9rem 2rem; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.15s; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 1rem; font-size: 0.78rem; color: #C9A84C; min-height: 1.2em; }
  .done { color: #34d399; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Quality<span>Jobs</span></div>
  <div class="sub">Data Migration Tool</div>
  <h2>Move your data to the new URL</h2>
  <p>This will copy all your client data, churned/paused history, invoices, tasks, and settings from this origin to <strong>dashboard.qualityjobs.com.au</strong>.</p>
  <div class="count" id="count">—</div>
  <div class="count-label">data keys found</div>
  <button id="btn" onclick="migrate()">Migrate Now →</button>
  <div class="status" id="status"></div>
</div>

<script>
const TARGET = 'https://dashboard.qualityjobs.com.au';
const keys = Object.keys(localStorage).filter(k => k.startsWith('qj_'));
document.getElementById('count').textContent = keys.length;

if (keys.length === 0) {
  document.getElementById('btn').disabled = true;
  document.getElementById('status').textContent = 'No QJ data found on this origin.';
}

function migrate() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = 'Migrating…';
  status.textContent = 'Opening import page…';

  const data = {};
  keys.forEach(k => { data[k] = localStorage.getItem(k); });
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));

  // Open import page on the target origin with data in the hash
  const importUrl = `${TARGET}/import.html#${encoded}`;
  const popup = window.open(importUrl, 'qj_migrate', 'width=500,height=400');

  // Listen for success message from import page
  window.addEventListener('message', function handler(e) {
    if (e.origin !== TARGET) return;
    if (e.data === 'qj_import_done') {
      window.removeEventListener('message', handler);
      status.innerHTML = '<span class="done">✓ Migration complete! Redirecting you now…</span>';
      setTimeout(() => {
        if (popup && !popup.closed) popup.close();
        window.location.href = `${TARGET}/command-centre.html`;
      }, 1500);
    }
  });

  status.textContent = 'Waiting for import to complete…';
}
</script>
</body>
</html>
